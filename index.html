<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WowoClean UAP</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            margin:20px;
        }

        h1{
            color:#333;
        }

        .card{
            background:white;
            padding:15px;
            margin-bottom:10px;
            border-radius:10px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        input, button{
            padding:10px;
            margin:5px;
        }

        #error{
            color:red;
        }

        #loginSection,
        #appSection{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

    <h1>WowoClean UAP</h1>

    <!-- LOGIN -->
    <div id="loginSection">

        <h2>Login</h2>

        <input type="email"
               id="email"
               placeholder="Email">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p id="loginError"></p>
    </div>

    <!-- APP -->
    <div id="appSection" style="display:none;">

        <button onclick="logout()">
            Logout
        </button>

        <h2>Total Muatan:
            <span id="totalWeight">0</span> KG
        </h2>

        <!-- FORM -->
        <h3>Tambah Container</h3>

        <form id="containerForm">

            <input type="text"
                   id="container_id"
                   placeholder="Container ID">

            <input type="text"
                   id="waste_type"
                   placeholder="Waste Type">

            <input type="number"
                   id="weight_kg"
                   placeholder="Weight">

            <input type="text"
                   id="status"
                   value="Active">

            <button type="submit">
                Tambah
            </button>
        </form>

        <p id="error"></p>

        <!-- DATA -->
        <h2>Data Containers</h2>

        <div id="containerList"></div>
    </div>

    <script src="app.js"></script>

</body>
</html>
